services:
  trialreservation:
    # 固定本地 tag：服务器上已有该镜像时直接复用，不会尝试远程拉取。
    # IMAGE_TAG 仅用于版本标签，由 scritps/build-save-image.sh 从 git tag 写入 .env
    # （compose 只能插值变量，不能执行 git）。
    # image: "trialreservation:${IMAGE_TAG:?IMAGE_TAG is not set; run scritps/build-save-image.sh or add IMAGE_TAG=... to .env}"
    image: "trialreservation:local"
    labels:
      - "org.opencontainers.image.version=${IMAGE_TAG:?IMAGE_TAG is not set; run scritps/build-save-image.sh or add IMAGE_TAG=... to .env}"
    build: .                    # 镜像不存在时（开发机）才按 Dockerfile 构建
    container_name: trialreservation
    restart: unless-stopped
    # 敏感配置从 env 文件注入，不写死在 compose 里，也不会打进镜像
    env_file: ./src/trialreservation.env
    # 容器专属运行配置（同名项覆盖 env_file）
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/trialreservations.db
    ports:
      - "127.0.0.1:8787:8787"   # 只暴露给本机，对外仍由 nginx + HTTPS 反代
    volumes:
      - ./data:/data
